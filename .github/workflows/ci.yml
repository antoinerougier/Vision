name: CI

# Runs on every pull request and on every push to main.
# Pipeline: lint -> tests (3 Python versions) -> model quality gate + Docker smoke test.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the previous (now obsolete) run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The default PyTorch wheel from PyPI bundles ~2 GB of CUDA libraries that a CPU-only
      # runner never uses. The CPU wheel is ~10x smaller and installs much faster.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: pip install -e ".[train,serve,dev]"
      - name: Run tests with coverage
        run: pytest --cov=isr_restore --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Model quality gate: evaluates the COMMITTED .onnx files on a fixed, seeded test set and
  # fails the build if the restoration layer no longer helps the detector enough.
  # This catches regressions coming from a new model OR from changes in the simulator,
  # the post-processing or the inference code.
  model-gate:
    name: Model quality gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # No PyTorch needed: the evaluation runs on ONNX Runtime, like production.
      - run: pip install -e ".[serve]" matplotlib
      - name: Benchmark and enforce the gate
        run: python -m isr_restore.evaluate --config configs/default.yaml --gate
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/

  # Builds the real production image and exercises it over HTTP, like a client would.
  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the image
        run: docker build -t isr-restore:ci .
      - name: Start the container
        run: docker run -d --name isr -p 8000:8000 isr-restore:ci
      - name: Wait for the readiness probe
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          echo "Container never became healthy" && docker logs isr && exit 1
      - name: Generate a degraded sample image
        run: |
          pip install -e .
          python scripts/make_sample_image.py --out sample.png --kind sar_speckle --severity 1.0
      - name: Call /detect and /preprocess
        run: |
          curl -fsS -F "file=@sample.png" "http://localhost:8000/detect?restore=true" | tee detect.json
          jq -e '.detections | type == "array"' detect.json
          curl -fsS -F "file=@sample.png" http://localhost:8000/preprocess -o restored.png
          file restored.png | grep -q "PNG image data"
      - name: Show container logs on failure
        if: failure()
        run: docker logs isr
