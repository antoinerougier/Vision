name: Release

# Publishing a version = pushing a git tag:   git tag v0.1.0 && git push origin v0.1.0
# The tag builds the serving image and publishes it to the GitHub Container Registry.
# Because the ONNX models are baked into the image, the image tag IS the model version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the image tags from the git tag: v1.2.3 -> 1.2.3, 1.2 and latest.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
