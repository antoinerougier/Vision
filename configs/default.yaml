# Single source of truth for hyper-parameters, paths and CI quality thresholds.
# A run is fully described by (git commit + this file).

seed: 42

data:
  # Source of clean images: "synthetic" (procedural scenes) or a YOLO-format folder.
  source: synthetic          # synthetic | yolo
  yolo_root: data/real       # used only when source == yolo
  image_size: 128            # side of the square test / detector images, in pixels

detector:
  base_channels: 24
  steps: 2500                # optimisation steps (not epochs: data is generated on the fly)
  batch_size: 32
  lr: 0.002
  weight_decay: 0.0001
  train_seed: 1              # sample seeds: train and test seeds must never overlap
  checkpoint: models/detector.pt
  # Baseline: the same detector trained WITH degradation augmentation (no restoration layer).
  # It answers the key product question: is a restoration layer better than just retraining?
  augmented_checkpoint: models/detector_augmented.pt
  augmented_degrade_probability: 0.75

restoration:
  base_channels: 16
  steps: 1800
  batch_size: 16
  patch_size: 96             # training crops are smaller than test images (faster, same stats)
  lr: 0.002
  weight_decay: 0.0
  train_seed: 2
  checkpoint: models/restoration.pt

export:
  onnx_dir: models
  opset: 17
  parity_tolerance: 0.0001   # max abs difference allowed between PyTorch and ONNX outputs

evaluation:
  test_seed: 1000            # disjoint from the training seeds
  n_images: 200
  severities: [0.5, 1.0, 1.3]   # 1.3 is OUTSIDE the training range (0.3 - 1.0): generalisation test
  ap_score_threshold: 0.05    # low threshold for AP: the full precision/recall curve is needed
  iou_threshold: 0.5
  report_dir: reports

# Quality gate enforced in CI (`python -m isr_restore.evaluate --gate`).
# The restored images must beat the degraded ones by at least this much, averaged over
# all degradation kinds at severity 1.0. A model that regresses below these floors
# cannot be merged.
gate:
  min_mean_ap_gain: 0.05          # absolute AP@0.5 gain
  min_mean_psnr_gain_db: 1.0      # dB
  max_latency_ms_per_image: 250   # CPU, 128x128, restoration + detection

# ----------------------------------------------------------------------------- tracking
# Second layer of the product: follow the detected ships over time and forecast where they
# will be. Everything below is SIMULATED (see scenario.py / trajectories.py).
tracking:
  scenario:
    size: 256
    dt_minutes: 2.0                 # one degraded frame every 2 minutes
    n_frames: 16                    # frame 0 = sharp reference photo, frames 1..15 = degraded
    n_ships: [2, 4]
    speed_px_per_min: [0.8, 2.5]    # a ship crosses 2 to 5 pixels between two frames
    maneuver_probability: 0.4       # share of ships that make a turn during the sequence
    turn_rate_deg_per_min: [2.0, 6.0]
    n_buoys: [0, 4]                 # static false alarms
  detection:
    score_threshold: 0.3
  forecast_horizon_minutes: 10.0
  kalman:
    process_noise: 0.01             # q, px^2/min^3: how much the ships may deviate from a straight line
    measurement_noise_px: 2.0       # std of a detected centre
    gate_chi2: 13.8                 # Mahalanobis^2 association gate (99.9 %, 2 dof)
    min_hits: 2                     # detections needed to confirm a track
    max_misses: 4                   # frames a confirmed track may coast without detection
    initial_speed_sigma: 2.0
  evaluation:
    seed: 5000                      # disjoint from every training seed
    n_scenarios: 40                 # spread evenly over the four degradation kinds
    severity: 1.0
    match_distance_px: 8.0          # a track "covers" a ship if its centre is this close
  # Quality floors enforced by `evaluate_tracking --gate` (set with a margin below the
  # measured values: completeness 0.69, ratio 0.36, coverage 0.97 when they were chosen).
  gate:
    min_track_completeness: 0.55            # share of ship-frames covered by a confirmed track
    max_kalman_to_stationary_error_ratio: 0.5   # the forecast must halve the error of "no motion"
    min_ellipse_coverage: 0.90              # the 95 % ellipse must really contain ~95 % of truths
