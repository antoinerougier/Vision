[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isr-restore"
version = "0.1.0"
description = "AI-assisted restoration of degraded ISR imagery (SAR speckle, low light, fog, thermal) as a pre-processing layer in front of existing detectors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies: everything needed to run the simulator and the metrics.
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training stack (PyTorch is NOT needed at inference time: the API runs on ONNX Runtime).
train = [
    "torch>=2.5",
    "onnx>=1.16",
    "matplotlib>=3.8",
]
# Serving stack: this is all the Docker image installs (no PyTorch -> small image).
serve = [
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# Developer tooling used by `make` and by the CI pipeline.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard HTML ships inside the package so that the Docker image (non-editable
# install) can serve it.
[tool.setuptools.package-data]
isr = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that train a model for a few steps (still CPU friendly)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 (line too long): the formatter already wraps code; long strings / comments are left alone.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as default values (`file: UploadFile = File(...)`):
# this is the framework's documented idiom, not the mutable-default bug B008 looks for.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
